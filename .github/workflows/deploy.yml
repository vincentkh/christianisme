name: Build and Deploy Jekyll PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Inject cache version and precache list into sw.js
        run: |
          export CACHE_VERSION=$(date -u +%Y%m%d%H%M%S)
          python3 << 'PYEOF'
          import os, json

          urls = set()
          for root, dirs, files in os.walk('_site'):
              for f in files:
                  if f == '404.html':
                      continue
                  if f.endswith('.html'):
                      path = os.path.join(root, f)[len('_site'):]
                      if f == 'index.html':
                          path = os.path.dirname(path).rstrip('/') + '/'
                      urls.add(path)

          precache_json = json.dumps(sorted(urls))
          cache_version = os.environ['CACHE_VERSION']

          sw_path = '_site/sw.js'
          content = open(sw_path).read()
          content = content.replace("'__CACHE_VERSION__'", "'" + cache_version + "'")
          content = content.replace('"__PRECACHE_URLS__"', precache_json)
          open(sw_path, 'w').write(content)

          print(f"SW patched: version={cache_version}, {len(urls)} URLs precached")
          PYEOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
